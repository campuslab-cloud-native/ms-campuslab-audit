openapi: 3.0.3

info:
  title: CampusLab Audit API
  version: 1.0.0
  description: >-
    API interna de consultas de auditoría. Este microservicio no implementa
    autenticación ni autorización por roles; esas comprobaciones se realizan
    en ms-campuslab-bff para las rutas públicas.

servers:
  - url: http://localhost:8085

tags:
  - name: Audit

paths:
  /api/v1/audit/events:
    get:
      tags:
        - Audit
      summary: Consultar eventos de auditoría
      operationId: getAuditEvents
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            description: Fecha-hora local ISO-8601, sin offset.
        - name: to
          in: query
          required: false
          schema:
            type: string
            description: Fecha-hora local ISO-8601, sin offset.
      responses:
        '200':
          description: Eventos encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEventResponse'

  /api/v1/audit/bookings/{bookingId}:
    get:
      tags:
        - Audit
      summary: Obtener timeline de una reserva
      operationId: getBookingTimeline
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Timeline encontrado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEventResponse'

components:
  schemas:
    AuditEventResponse:
      type: object
      properties:
        eventId:
          type: string
        bookingId:
          type: integer
          format: int64
        userId:
          type: string
        type:
          type: string
        timestamp:
          type: string
          description: Fecha-hora local ISO-8601, sin offset.
        source:
          type: string
