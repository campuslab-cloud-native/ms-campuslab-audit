
spring.application.name=ms-campuslab-audit

server.port=${SERVER_PORT:8085}

# Oracle
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME:CAMPUSLAB_AUDIT}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health

# Kafka - local / EC2
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}

# Consumer
spring.kafka.consumer.group-id=campuslab-audit
spring.kafka.consumer.auto-offset-reset=earliest

# Deserializacion con manejo de errores
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

# Deserializadores reales
spring.kafka.consumer.properties[spring.deserializer.key.delegate.class]=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties[spring.deserializer.value.delegate.class]=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

# Tipo del mensaje recibido
spring.kafka.consumer.properties[spring.json.value.default.type]=ms_campuslab_audit.messaging.model.BookingEvent
spring.kafka.consumer.properties[spring.json.trusted.packages]=ms_campuslab_audit.messaging.model

# Confirmacion de offsets
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
# Un hilo consumidor por particion (bookings.events tiene 3 particiones)
spring.kafka.listener.concurrency=3

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
# Evita duplicados al reintentar el envio
spring.kafka.producer.properties[enable.idempotence]=true

# Topics
campuslab.kafka.topics.bookings=bookings.events
campuslab.kafka.topics.audit=audit.timeline
